name: Build Android Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Extract Project Zip
      run: |
        sudo apt-get install -y unzip
        find . -name "*.zip" -exec unzip -o {} \;
        touch .env
        ls -la

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Generate Official Keystore
      run: |
        keytool -genkey -v -keystore my-upload-key.jks -storepass razealmas123 -alias upload -keypass razealmas123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=RevayateMa,O=RevayateMa,C=IR"
        mkdir -p app
        cp my-upload-key.jks app/my-upload-key.jks || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Setup Gradle Wrapper 9.3.1
      run: |
        gradle wrapper --gradle-version 9.3.1
        chmod +x gradlew

    - name: Build Release APK without Lint
      env:
        STORE_PASSWORD: razealmas123
        KEY_PASSWORD: razealmas123
        KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
      run: ./gradlew assembleRelease -x test -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease --no-daemon --stacktrace

    - name: Upload Release APK Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: RazeAlmas-Release-APK
        path: app/build/outputs/apk/release/*.apk
        
